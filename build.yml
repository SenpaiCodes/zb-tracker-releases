# Builds the installers on GitHub's own machines and publishes them.
#
# The point of running here rather than locally is macOS: a Mac app should be
# built on a Mac, and this is the only Mac in the project. Push a tag and both
# installers appear as downloads on the Releases page.
#
# It runs on every push to main and publishes a release named after the version
# in package.json, creating the tag itself. Bump that version for a new release;
# pushing again without bumping updates the existing one in place.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for the release step to attach the built files.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the other's build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            # `--x64` spelled out for the same reason as the Mac line below:
            # naming the platform on the command line discards the arch list
            # from electron-builder.yml, and the installer came out at twice the
            # size — a valid installer, but carrying a payload it doesn't need.
            target: --win --x64
          - os: macos-latest
            name: macOS
            # dmg as well as zip, because this runner is a Mac and can make one.
            # The checked-in config stays zip-only so the build also works on
            # Linux, where dmg creation is impossible.
            #
            # Both architectures spelled out: naming targets on the command line
            # discards the arch list from the config, and the runner is Apple
            # Silicon — so without this, Intel Macs get nothing.
            target: --mac dmg zip --x64 --arm64

    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` also fetches the bundled OCR model via the postinstall script.
      - run: npm ci

      - run: npm run typecheck

      # The parser tests use node --test with a glob, which bash expands and
      # PowerShell does not — so they run on the Unix runner.
      - if: runner.os == 'macOS'
        run: npm test

      - run: npm run dist -- ${{ matrix.target }}
        env:
          # No Apple Developer certificate, so skip signing rather than fail.
          # Users get one right-click → Open on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

      - name: Publish to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Z&B Tracker ${{ steps.ver.outputs.v }}
          draft: false
          make_latest: true
          # Each platform only produces its own kind of file — the Windows job
          # has no .dmg and the Mac job has no .exe — so an unmatched pattern is
          # expected, not an error. Both jobs add to the same release.
          fail_on_unmatched_files: false
          body: |
            **Windows** — download `ZB-Tracker-Setup-${{ steps.ver.outputs.v }}.exe` and run it.
            One click: it replaces any older version, keeps your journal, and launches.

            **macOS** — download the `.dmg` for your Mac: `arm64` for Apple silicon
            (M1 and later), the other for Intel. Drag the app to Applications.

            Neither build is signed with an Apple certificate, so the first launch is
            blocked with *"Apple could not verify…"*. To allow it, **once**:

            1. Open the app. On the warning, click **Done** — not *Move to Trash*.
            2. Go to  → **System Settings** → **Privacy & Security**.
            3. Scroll to **Security**. There is a line saying Z&B Tracker was blocked,
               with an **Open Anyway** button. Click it, then **Open Anyway** again
               and enter your password or Touch ID.

            The button only appears in the hour after you tried to launch it, so if it
            is not there, open the app again first. Right-click → Open no longer works
            as a shortcut for this — Apple removed it in macOS Sequoia.

            Your journal lives outside the app and is never touched by installing or
            uninstalling: `%APPDATA%\ZB Tracker` on Windows,
            `~/Library/Application Support/ZB Tracker` on macOS.
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
